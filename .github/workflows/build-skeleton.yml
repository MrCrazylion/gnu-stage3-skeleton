# Build an amd64/glibc/systemd rootfs, then finalize an extracted copy.
# Catalyst must retain its build tools until its entire action sequence ends.
# Runtime checks gate publication; upstream purity and VM boot are not implied.
name: build-skeleton

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    container:
      image: gentoo/stage3:latest
      options: --privileged

    env:
      GENTOO_AUTOBUILDS_URL: https://distfiles.gentoo.org/releases/amd64/autobuilds
      LATEST_POINTER: latest-stage3-amd64-systemd.txt
      CATALYST_BUILDS: /var/tmp/catalyst/builds/default

    steps:
      # gentoo/stage3 has no git/curl/catalyst - pull a fresh ebuild snapshot
      # and emerge them before anything else.
      - name: Install git, curl and Catalyst
        run: |
          set -euo pipefail
          emerge-webrsync
          emerge --quiet --oneshot dev-vcs/git net-misc/curl
          # dev-util/catalyst is ~amd64 (testing) only; unmask it and pull any
          # testing deps it needs.
          mkdir -p /etc/portage/package.accept_keywords
          printf '%s\n' 'dev-util/catalyst ~amd64' > /etc/portage/package.accept_keywords/catalyst
          emerge --quiet --oneshot --autounmask-continue=y dev-util/catalyst
          git config --global --add safe.directory '*'
          # pkgcache adds --newuse and can skip an unchanged overlay package.
          # Disable it so the explicit stage4 toolchain requests compile from source.
          python3 - <<'PYCONFIG'
          import json, re, tomllib
          from pathlib import Path
          p = Path('/etc/catalyst/catalyst.conf')
          text = p.read_text()
          config = tomllib.loads(text)
          options = [x for x in config['options'] if x != 'pkgcache']
          text, count = re.subn(r'(?ms)^options\s*=\s*\[.*?\]',
                               'options = ' + json.dumps(options), text, count=1)
          assert count == 1 and 'pkgcache' not in tomllib.loads(text)['options']
          p.write_text(text)
          PYCONFIG
          # Use all runner cores for the toolchain rebuild.
          sed -i "s|^#\?jobs\s*=.*|jobs = $(nproc)|" /etc/catalyst/catalyst.conf || true
          echo "--- catalyst version / config ---"
          catalyst --version || true
          grep -E '^(repo_basedir|repo_name|storedir|jobs)\s*=' /etc/catalyst/catalyst.conf || true

      # Catalyst 4 builds the snapshot by running `git archive` against a BARE
      # repo at ${storedir}/repos/<repo_name>.git (default
      # /var/tmp/catalyst/repos/gentoo.git). If that path is missing it still
      # writes an empty .sqfs and exits 0, so we must provision it here.
      - name: Provision bare Gentoo repo for Catalyst 4 snapshot
        run: |
          set -euo pipefail
          dest=/var/tmp/catalyst/repos/gentoo.git
          mkdir -p "$(dirname "${dest}")"
          rm -rf "${dest}"
          git clone --bare --depth=1 --single-branch --branch master \
            https://github.com/gentoo/gentoo.git "${dest}" \
            || git clone --bare --depth=1 --single-branch --branch master \
                 https://anongit.gentoo.org/git/repo/gentoo.git "${dest}"
          git -C "${dest}" log --oneline -1
          # The overlay and Catalyst snapshot must use the same repository revision.
          git clone --shared "${dest}" /tmp/gentoo-source
          echo "GENTOO_SRC=/tmp/gentoo-source" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the vanilla toolchain overlay
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-overlay.sh
          scripts/prepare-overlay.sh

      - name: Seed the latest stage3-amd64-systemd tarball
        run: |
          set -euo pipefail
          mkdir -p "${CATALYST_BUILDS}"

          rel_path="$(curl -fsSL "${GENTOO_AUTOBUILDS_URL}/${LATEST_POINTER}" \
            | grep -v '^#' \
            | grep -E 'stage3-amd64-systemd-[0-9TZ]+\.tar\.xz' \
            | head -n1 | cut -d' ' -f1)"
          test -n "${rel_path}" || { echo "::error::cannot resolve latest stage3"; exit 1; }
          fn="$(basename "${rel_path}")"
          echo "Seed: ${fn}"

          curl -fsSL -o "${CATALYST_BUILDS}/${fn}"        "${GENTOO_AUTOBUILDS_URL}/${rel_path}"
          curl -fsSL -o "${CATALYST_BUILDS}/${fn}.sha256" "${GENTOO_AUTOBUILDS_URL}/${rel_path}.sha256"
          ( cd "${CATALYST_BUILDS}" && grep -E "  ${fn}\$" "${fn}.sha256" | sha256sum -c - )

          # source_subpath: default/stage3-amd64-systemd-latest
          ln -sf "${fn}" "${CATALYST_BUILDS}/stage3-amd64-systemd-latest.tar.xz"
          ls -lh "${CATALYST_BUILDS}"

      - name: Materialise the portage snapshot (Catalyst 4, git-based)
        run: |
          set -euo pipefail
          catalyst -s master
          ls -lh /var/tmp/catalyst/snapshots/
          # catalyst -s exits 0 even when `git archive` fails and writes an
          # empty squashfs - guard against that here.
          sz="$(stat -c%s /var/tmp/catalyst/snapshots/gentoo-master.sqfs)"
          echo "snapshot size: ${sz} bytes"
          test "${sz}" -gt 10000000 \
            || { echo "::error::snapshot is empty (${sz} B) - git archive failed"; exit 1; }

      - name: Run Catalyst stage4 build
        run: |
          set -euo pipefail
          catalyst -f catalyst/base-skeleton.spec 2>&1 | tee catalyst-build.log

      - name: Finalize and validate the output tarball
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find /var/tmp/catalyst/builds -name 'stage4-*.tar.xz' -type f)
          test "${#candidates[@]}" -eq 1 || { echo "::error::expected exactly one stage4 tarball"; exit 1; }
          src="${candidates[0]}"
          echo "Built: ${src}"
          bash scripts/finalize-artifact.sh "${src}" "${GITHUB_WORKSPACE}/gnu-stage3-skeleton-amd64.tar.xz"
          ( cd "${GITHUB_WORKSPACE}" \
            && sha256sum gnu-stage3-skeleton-amd64.tar.xz | tee gnu-stage3-skeleton-amd64.tar.xz.sha256 )
          ls -lh "${GITHUB_WORKSPACE}/gnu-stage3-skeleton-amd64.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnu-stage3-skeleton-amd64
          path: |
            gnu-stage3-skeleton-amd64.tar.xz
            gnu-stage3-skeleton-amd64.tar.xz.sha256
            gnu-stage3-skeleton-amd64.tar.xz.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-diagnostics
          path: |
            catalyst-build.log
            gnu-stage3-skeleton-amd64.tar.xz.manifest.json
          if-no-files-found: ignore
          retention-days: 14
