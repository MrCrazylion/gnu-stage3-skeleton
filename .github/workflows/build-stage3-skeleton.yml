# Build an identity-less GNU/Linux rootfs from a Gentoo stage3-systemd tarball.
#
# This workflow takes an upstream Gentoo stage3-amd64-systemd image and strips it
# of everything that makes it "Gentoo": distro branding, the Portage package
# manager and its data, and Gentoo-specific helper tools. Nothing is put back in
# its place - the result is a bare GNU/Linux root filesystem with no os-release,
# no package manager and no distro identity.
name: build-stage3-skeleton

on:
  # Manual trigger only - this is a heavy, privileged build.
  workflow_dispatch:

# We only read repo contents; the output leaves via the artifact upload.
permissions:
  contents: read

jobs:
  build-skeleton:
    runs-on: ubuntu-latest

    env:
      # Gentoo autobuilds mirror for amd64 stage3 images.
      GENTOO_AUTOBUILDS_URL: https://distfiles.gentoo.org/releases/amd64/autobuilds
      # Pointer file that always names the newest stage3-amd64-systemd build.
      LATEST_POINTER: latest-stage3-amd64-systemd.txt
      # Where the root filesystem is unpacked and mangled.
      ROOTFS_DIR: work/rootfs
      # Final, brand-free output tarball.
      OUTPUT_TARBALL: generic-gnu-stage3-x86_64.tar.xz

    steps:
      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils ca-certificates

      - name: Write identity-strip script
        run: |
          set -euo pipefail
          mkdir -p work

          # The cleanup script ONLY deletes. It never writes a replacement
          # os-release, issue file, package manager or distro tooling.
          cat > work/strip-identity.sh <<'CLEANUP'
          #!/usr/bin/env bash
          #
          # strip-identity.sh <rootfs-dir>
          #
          # Turn a Gentoo stage3 into an identity-less GNU/Linux rootfs by
          # deleting - and only deleting - branding, Portage, and Gentoo tools.
          set -euo pipefail

          ROOT="${1:?usage: strip-identity.sh <rootfs-dir>}"
          cd "${ROOT}"

          # Remove each path/glob without failing the build when a target is
          # already absent. `rm -f` returns success on missing files, and on an
          # unmatched glob it just gets the literal pattern, which -f swallows.
          nuke() {
            local target
            for target in "$@"; do
              echo "  rm -rf ${target}"
              # Intentionally unquoted so shell globs expand.
              rm -rf -- ${target}
            done
          }

          echo "==> Removing distro branding / identity files"
          nuke \
            "etc/os-release" \
            "usr/lib/os-release" \
            "etc/gentoo-release" \
            "etc/issue" \
            "etc/issue.d" \
            "etc/issue.net"
          # Catch any remaining etc/issue* variants the image might ship.
          nuke "etc/issue*"

          echo "==> Removing Portage package-manager data and tooling"
          nuke \
            "var/db/repos/*" \
            "var/db/pkg/*" \
            "var/cache/*" \
            "etc/portage" \
            "usr/lib/python*/site-packages/portage" \
            "usr/bin/emerge"

          echo "==> Removing Gentoo-specific utilities"
          nuke \
            "usr/bin/eselect" \
            "etc/env.d" \
            "usr/bin/qlist"

          echo "==> Identity strip complete"
          CLEANUP

          chmod +x work/strip-identity.sh

      - name: Resolve latest Gentoo stage3-amd64-systemd tarball
        id: resolve
        run: |
          set -euo pipefail

          # The pointer file has comment lines (#...) plus one data line:
          #   <TIMESTAMP>/stage3-amd64-systemd-<TIMESTAMP>.tar.xz <size> <hashes>
          # We only need the first field: the path relative to the mirror URL.
          rel_path="$(curl -fsSL "${GENTOO_AUTOBUILDS_URL}/${LATEST_POINTER}" \
            | grep -v '^#' \
            | grep -E 'stage3-amd64-systemd-[0-9TZ]+\.tar\.xz' \
            | head -n1 \
            | cut -d' ' -f1)"

          if [ -z "${rel_path}" ]; then
            echo "::error::Could not determine latest stage3 tarball from ${LATEST_POINTER}"
            exit 1
          fi

          echo "Latest stage3: ${rel_path}"
          {
            echo "rel_path=${rel_path}"
            echo "file_name=$(basename "${rel_path}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Download and verify stage3 tarball
        run: |
          set -euo pipefail

          rel_path='${{ steps.resolve.outputs.rel_path }}'
          file_name='${{ steps.resolve.outputs.file_name }}'

          mkdir -p download
          cd download

          # Fetch the tarball and Gentoo's published SHA-256 checksum file.
          curl -fsSL -o "${file_name}"        "${GENTOO_AUTOBUILDS_URL}/${rel_path}"
          curl -fsSL -o "${file_name}.sha256" "${GENTOO_AUTOBUILDS_URL}/${rel_path}.sha256"

          # The .sha256 file may include comment lines; keep only the record for
          # our tarball and hand a clean "<hash>  <file>" line to `sha256sum -c`.
          grep -E "  ${file_name}\$" "${file_name}.sha256" > checksum.txt
          sha256sum -c checksum.txt
          echo "Checksum OK: ${file_name}"

      - name: Extract rootfs (privileged, numeric owner)
        run: |
          set -euo pipefail

          file_name='${{ steps.resolve.outputs.file_name }}'

          # Start from a clean, root-owned target. stage3 carries real uid/gid
          # metadata, setuid binaries and device nodes, so extraction needs sudo
          # and --numeric-owner (do not remap to the runner's users/groups).
          sudo rm -rf "${ROOTFS_DIR}"
          sudo mkdir -p "${ROOTFS_DIR}"

          sudo tar \
            --numeric-owner \
            --xattrs --xattrs-include='*.*' \
            -xpf "download/${file_name}" \
            -C "${ROOTFS_DIR}"

          echo "Extracted stage3 into ${ROOTFS_DIR}"

      - name: Run identity strip
        run: |
          set -euo pipefail
          # Runs as root: most of the rootfs is root-owned.
          sudo bash work/strip-identity.sh "${ROOTFS_DIR}"

      - name: Sanity check - identity is gone
        run: |
          set -euo pipefail
          fail=0

          # These must no longer exist at all.
          for p in \
            etc/os-release usr/lib/os-release etc/gentoo-release \
            etc/portage usr/bin/emerge usr/bin/eselect \
            usr/bin/qlist etc/env.d ; do
            if sudo test -e "${ROOTFS_DIR}/${p}"; then
              echo "::error::Expected ${p} to be removed, but it still exists"
              fail=1
            fi
          done

          # These dirs may remain (only their contents were removed), but must
          # be empty.
          for d in var/db/repos var/db/pkg var/cache ; do
            if sudo test -d "${ROOTFS_DIR}/${d}" \
               && [ -n "$(sudo ls -A "${ROOTFS_DIR}/${d}")" ]; then
              echo "::error::Expected ${ROOTFS_DIR}/${d} to be empty"
              fail=1
            fi
          done

          exit "${fail}"

      - name: Repack identity-less rootfs
        run: |
          set -euo pipefail

          # Pack the rootfs *contents* (-C "${ROOTFS_DIR}" .) so there is no
          # leading directory prefix. Preserve permissions, numeric ownership and
          # xattrs. -T0 lets xz use all runner cores.
          sudo env XZ_OPT='-9 -T0' tar \
            --numeric-owner \
            --xattrs --xattrs-include='*.*' \
            -cpJf "${OUTPUT_TARBALL}" \
            -C "${ROOTFS_DIR}" .

          # Hand the artifact back to the unprivileged runner user for upload.
          sudo chown "$(id -u):$(id -g)" "${OUTPUT_TARBALL}"
          ls -lh "${OUTPUT_TARBALL}"
          sha256sum "${OUTPUT_TARBALL}" | tee "${OUTPUT_TARBALL}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnu-stage3-skeleton
          path: |
            generic-gnu-stage3-x86_64.tar.xz
            generic-gnu-stage3-x86_64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14
