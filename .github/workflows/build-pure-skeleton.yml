# Build a pure, identity-less GNU/Linux systemd skeleton with Gentoo Catalyst.
#
# Catalyst recompiles the core toolchain and system set with "vanilla -branding"
# USE flags (no Gentoo patches, no branding), unmerges Portage/eselect, empties
# the package DB and caches, then runs catalyst/strip-identity.sh inside the
# chroot to delete every remaining Gentoo identity file.
#
# This is a from-source build of gcc/glibc/binutils/systemd. It is slow (hours)
# and disk-hungry, hence the aggressive runner cleanup and the use of /mnt
# (the large ephemeral disk) for Catalyst scratch space.
name: build-pure-skeleton

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Gentoo autobuilds mirror for amd64 stage3 images.
  GENTOO_AUTOBUILDS_URL: https://distfiles.gentoo.org/releases/amd64/autobuilds
  LATEST_POINTER: latest-stage3-amd64-systemd.txt
  # Catalyst container image (a plain stage3; we install Catalyst into it).
  CATALYST_IMAGE: gentoo/stage3:latest
  # Catalyst scratch tree on the big /mnt disk, bind-mounted into the container.
  CATALYST_WORK: /mnt/catalyst
  # Final artifact file name.
  OUTPUT_TARBALL: gnu-stage3-skeleton-x86_64.tar.xz

jobs:
  build-skeleton:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Step 1: reclaim disk for the source build -----------------------
      - name: Maximize runner disk space
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"; df -h / /mnt

          # Delete large pre-installed toolchains we do not need. `|| true` so a
          # missing path never fails the job.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /opt/microsoft \
            /usr/share/swift || true

          sudo docker image prune -af || true
          sudo apt-get clean || true

          echo "Disk after cleanup:"; df -h / /mnt

      # --- Step 2/3: prepare Catalyst scratch + mount the repo's catalyst/ --
      - name: Prepare Catalyst working tree
        run: |
          set -euo pipefail

          # Catalyst expects builds/<rel_type>/<seed>.tar.xz for source_subpath.
          sudo mkdir -p \
            "${CATALYST_WORK}/builds/default" \
            "${CATALYST_WORK}/snapshots" \
            "${CATALYST_WORK}/tmp"
          sudo chmod -R 0777 "${CATALYST_WORK}"

      # --- Step 4: seed the latest upstream stage3-amd64-systemd tarball ----
      - name: Fetch latest stage3-amd64-systemd seed
        run: |
          set -euo pipefail

          # The pointer file lists the newest build as its single data line.
          rel_path="$(curl -fsSL "${GENTOO_AUTOBUILDS_URL}/${LATEST_POINTER}" \
            | grep -v '^#' \
            | grep -E 'stage3-amd64-systemd-[0-9TZ]+\.tar\.xz' \
            | head -n1 \
            | cut -d' ' -f1)"
          test -n "${rel_path}" || { echo "::error::cannot resolve latest stage3"; exit 1; }
          file_name="$(basename "${rel_path}")"
          echo "Latest seed: ${file_name}"

          seed_dir="${CATALYST_WORK}/builds/default"
          curl -fsSL -o "${seed_dir}/${file_name}"        "${GENTOO_AUTOBUILDS_URL}/${rel_path}"
          curl -fsSL -o "${seed_dir}/${file_name}.sha256" "${GENTOO_AUTOBUILDS_URL}/${rel_path}.sha256"

          ( cd "${seed_dir}" \
            && grep -E "  ${file_name}\$" "${file_name}.sha256" | sha256sum -c - )

          # source_subpath in the spec is default/stage3-amd64-systemd-latest, so
          # Catalyst looks for builds/default/stage3-amd64-systemd-latest.tar.xz.
          ln -sf "${file_name}" "${seed_dir}/stage3-amd64-systemd-latest.tar.xz"
          ls -lh "${seed_dir}"

      # --- Step 5: run Catalyst inside the gentoo/stage3 container ----------
      - name: Run Catalyst stage4 build
        run: |
          set -euo pipefail

          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}/catalyst:/root/catalyst:ro" \
            -v "${CATALYST_WORK}:/var/tmp/catalyst" \
            -e "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}" \
            "${CATALYST_IMAGE}" \
            /bin/bash -euxo pipefail -c '
              # Catalyst is not in a plain stage3 - install it from a fresh tree.
              emerge-webrsync
              emerge --quiet --oneshot dev-util/catalyst

              # Minimal catalyst.conf tweaks; defaults are otherwise fine.
              sed -i "s|^# *jobs *=.*|jobs = $(nproc)|" /etc/catalyst/catalyst.conf || true

              # Materialise the portage snapshot referenced by snapshot_treeish.
              catalyst -s stable

              # Build the stage4 skeleton.
              catalyst -f /root/catalyst/base-skeleton.spec

              # Hand results back to the runner user for upload.
              chmod -R a+rX /var/tmp/catalyst/builds || true
            '

      # --- Step 6: collect and upload the resulting tarball ----------------
      - name: Locate and rename output tarball
        id: out
        run: |
          set -euo pipefail
          src="$(find "${CATALYST_WORK}/builds" -name 'stage4-*.tar.xz' -type f | head -n1)"
          test -n "${src}" || { echo "::error::no stage4 tarball produced"; exit 1; }
          echo "Built: ${src}"
          sudo cp "${src}" "${GITHUB_WORKSPACE}/${OUTPUT_TARBALL}"
          sudo chown "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/${OUTPUT_TARBALL}"
          ( cd "${GITHUB_WORKSPACE}" \
            && sha256sum "${OUTPUT_TARBALL}" | tee "${OUTPUT_TARBALL}.sha256" )
          ls -lh "${GITHUB_WORKSPACE}/${OUTPUT_TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnu-stage3-skeleton-x86_64
          path: |
            gnu-stage3-skeleton-x86_64.tar.xz
            gnu-stage3-skeleton-x86_64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14
